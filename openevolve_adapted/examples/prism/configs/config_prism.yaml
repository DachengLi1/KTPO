# Prism — KTPO task config
# GPU Model Placement optimization

variables:
  PROBLEM_TYPE: "Prism"
  MAX_RUNTIME: 360

  score_transform:
    score_range_min: 0.0
    score_range_max: 30.0
    alpha: 2.0
    optimize_mode: "maximize"
    positive_multiplier: 5.0

checkpoint_interval: 128
max_code_length: 60000
log_level: "INFO"

llm:
  # Not used for sampling: rollout sampling is set by launcher flags (--rollout-temperature 1.0).
  models:
    - name: "Qwen/Qwen3-4B-Instruct-2507"
      weight: 1.0
  api_base: "http://127.0.0.1:8000/v1"
  api_key: "EMPTY"
  timeout: 600
  retries: 3
  retry_delay: 5

prompt:
  use_system_prompt: false

  use_system_message_sampling: true
  system_message_list:
    - message: |
        You are an expert for model placement on GPUs. Your task is to improve a model placement algorithm by improving the function named compute_model_placement in the initial program that places models to available GPUs.
        The algorithm must MINIMIZE the maximum KVPR across all GPUs while ensuring models can fit into the GPUs' memory. Note that KVPR is KV cache pressure for a GPU. It indicates how crowded a GPU is. For a specific GPU, its KVPR is computed as sum(model.req_rate/model.slo for model in models) / (GPU_MEM_SIZE - sum(model.model_size for model in models)), where models are the models on this GPU.
        The generated program should be as simple as possible and the code should be executed correctly without errors.
      weight: 1.0

  num_top_programs: 0
  num_diverse_programs: 0
  num_inspiration_programs: 0
  use_template_stochasticity: true
  include_artifacts: true
  max_artifact_bytes: 16384
  artifact_security_filter: true

database:
  population_size: 9999
  archive_size: 10
  num_islands: 1
  feature_dimensions:
    - "score"
    - "complexity"
  log_prompts: true

evaluator:
  timeout: 400
  max_retries: 0
  cascade_evaluation: false
  parallel_evaluations: 16
  use_llm_feedback: false
  enable_artifacts: true
  collect_runtime_environments: true
  preserve_temp_directories: false
  runtime_environment_patterns:
    - "*"

