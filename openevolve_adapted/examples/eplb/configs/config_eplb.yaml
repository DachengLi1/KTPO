# EPLB — KTPO task config
# Expert Parallelism Load Balancer for MoE models

variables:
  PROBLEM_TYPE: "EPLB"
  MAX_RUNTIME: 360

  score_transform:
    score_range_min: 0.0
    score_range_max: 0.2
    alpha: 2.0
    optimize_mode: "maximize"
    positive_multiplier: 5.0

checkpoint_interval: 128
max_code_length: 60000
log_level: "INFO"

llm:
  # Not used for sampling: rollout sampling is set by launcher flags (--rollout-temperature 1.0).
  models:
    - name: "Qwen/Qwen3-4B-Instruct-2507"
      weight: 1.0
  api_base: "http://127.0.0.1:8000/v1"
  api_key: "EMPTY"
  timeout: 600
  retries: 3
  retry_delay: 5

prompt:
  use_system_prompt: false

  use_system_message_sampling: true
  system_message_list:
    - message: |
        You are an expert programmer specializing in optimization algorithms. Your task is to improve the Mixture-of-Expert models Expert Parallelism Load Balancer (MoE EPLB) expert rearrangement algorithm.
        This algorithm will take the load metrics recorded by the vLLM server, and rearrange the experts to balance the load. It can make replicas of some experts to achieve better load balancing.
        Your goal will be two-fold:
        1. Improve the algorithm to achieve better load balancing; while
        2. Improve the algorithm to be more efficient, i.e. reduce the execution time of the algorithm itself, since perfect load balancing is NP-hard.
        The current algorithm is implemented in the `rebalance_experts` function.
      weight: 1.0

  num_top_programs: 0
  num_diverse_programs: 0
  num_inspiration_programs: 0
  use_template_stochasticity: true
  include_artifacts: true
  max_artifact_bytes: 16384
  artifact_security_filter: true

database:
  population_size: 9999
  archive_size: 10
  num_islands: 1
  feature_dimensions:
    - "score"
    - "complexity"
  log_prompts: true

evaluator:
  timeout: 400
  max_retries: 0
  cascade_evaluation: false
  parallel_evaluations: 16
  use_llm_feedback: false
  enable_artifacts: true
  collect_runtime_environments: true
  preserve_temp_directories: false
  runtime_environment_patterns:
    - "*"

